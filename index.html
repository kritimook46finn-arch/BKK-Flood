<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangkok Drainage & Flood Routing Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        /* กำหนดสีพื้นหลังแผนที่เป็นสีเข้ม เพื่อให้เห็นเส้นถนนชัดเจนขึ้น */
        #map { height: 100%; min-height: 600px; border-radius: 0.75rem; z-index: 1; background-color: #0f172a; }
        
        /* Custom Icons */
        .station-icon {
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 50%;
            font-weight: bold; color: white; font-size: 14px;
            border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        .pump-normal { background-color: #3b82f6; }
        .pump-working { background-color: #22c55e; animation: pulse 1.5s infinite; }
        
        .poi-icon {
            background-color: #f8fafc; color: #0f172a; width: auto; height: 24px;
            padding: 0 8px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; border: 2px solid #64748b; white-space: nowrap;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        
        path.leaflet-interactive { transition: stroke 0.3s, stroke-width 0.3s, stroke-dasharray 0.3s; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg shrink-0">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-map-location-dot text-blue-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">BKK <span class="text-blue-400">SAFE-ROUTE</span> MONITOR</h1>
            <span class="ml-4 px-2 py-1 bg-slate-800 rounded text-xs border border-slate-600">ผังคลอง + ระบบหาทางเลี่ยงน้ำท่วม</span>
        </div>
        <div class="text-right">
            <div id="clock" class="text-lg font-mono font-bold text-slate-100">--:--:--</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row gap-4 p-4 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-1/3 lg:w-1/4 bg-slate-800 rounded-xl flex flex-col overflow-y-auto custom-scrollbar shadow-xl border border-slate-700 p-4 gap-4">
            
            <!-- Controls Panel -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                <h2 class="text-sm font-bold text-slate-400 uppercase mb-3"><i class="fa-solid fa-car-burst mr-2"></i>ระบบจำลองสถานการณ์</h2>
                <div class="flex flex-col gap-2">
                    <button onclick="triggerFlood('ladprao')" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded transition shadow-lg">
                        จำลอง: น้ำท่วมแยกลาดพร้าว
                    </button>
                    <button onclick="triggerFlood('srinagarindra')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition shadow-lg">
                        จำลอง: น้ำท่วม ถ.ศรีนครินทร์
                    </button>
                    <button onclick="resetRoutes()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded transition mt-2 border border-slate-500">
                        รีเซ็ตเส้นทาง (ปกติ)
                    </button>
                </div>
            </div>

            <!-- Routing Info Panel -->
            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 flex-1">
                <h2 class="text-sm font-bold text-slate-400 uppercase mb-3"><i class="fa-solid fa-route mr-2"></i>คำแนะนำเส้นทาง</h2>
                
                <div id="route-status" class="bg-green-500/20 border border-green-500 p-3 rounded-lg text-green-400 mb-3 transition-all duration-300">
                    <div class="flex items-center gap-2 font-bold mb-1"><i class="fa-solid fa-circle-check"></i> เส้นทางปกติ (ปลอดภัย)</div>
                    <p class="text-xs">ปัจจุบันไม่มีรายงานน้ำท่วมขังบนถนนสายหลัก สามารถสัญจรได้ตามปกติ</p>
                </div>

                <div id="reroute-info" class="hidden transition-all duration-300">
                    <h3 class="text-xs font-bold text-slate-300 mb-2">เส้นทางเลี่ยงที่แนะนำ:</h3>
                    <ul id="reroute-steps" class="text-xs text-slate-400 space-y-3 border-l-2 border-blue-500 pl-3 ml-1 mt-3">
                        <!-- ถูกเติมด้วย JS -->
                    </ul>
                </div>
            </div>

        </aside>

        <!-- Map Container -->
        <div class="w-full md:w-2/3 lg:w-3/4 bg-slate-800 rounded-xl relative border border-slate-700 shadow-xl overflow-hidden p-1">
            <div id="map"></div>
            
            <!-- Legend -->
            <div class="absolute bottom-6 left-6 z-[400] bg-slate-900/90 backdrop-blur border border-slate-700 p-3 rounded-lg shadow-lg">
                <h4 class="text-xs font-bold text-slate-300 mb-2">สัญลักษณ์</h4>
                <div class="flex flex-col gap-2 text-xs text-slate-400">
                    <div class="flex items-center gap-2"><div class="w-6 h-1 bg-blue-500"></div> ถนนปกติ</div>
                    <div class="flex items-center gap-2"><div class="w-6 h-1 bg-red-500" style="border-top: 2px dashed #f8fafc;"></div> น้ำท่วม (หลีกเลี่ยง)</div>
                    <div class="flex items-center gap-2"><div class="w-6 h-1 bg-green-400" style="border-top: 2px dashed #f8fafc;"></div> ทางเลี่ยงที่แนะนำ</div>
                    <hr class="border-slate-700 my-1">
                    <div class="flex items-center gap-2"><span class="station-icon pump-working w-4 h-4 text-[8px]">P</span> เครื่องสูบน้ำทำงาน</div>
                </div>
            </div>
        </div>
    </main>

    <!-- !!! เพิ่ม Leaflet JS ที่ตกหล่นไปตรงนี้ !!! -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. นาฬิกา
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('th-TH'); }, 1000);

        // 2. ตั้งค่าแผนที่ CRS.Simple (แผนภาพแกน X,Y)
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -1, maxZoom: 2, zoomControl: true });
        
        // กำหนดขนาดจำลองของภาพแผนผัง
        const imgWidth = 2000;
        const imgHeight = 1200;
        const bounds = [[0, 0], [imgHeight, imgWidth]];
        
        // ดึงภาพจากโฟลเดอร์เดียวกันมาใช้ และปรับความสว่าง (opacity) ให้เห็นชัดๆ
        L.imageOverlay('bkk-klong.png', bounds, {opacity: 0.8}).addTo(map);
        map.fitBounds(bounds);
        map.setView([600, 1000], -1);

        // ==========================================
        // 3. กำหนดโครงข่ายถนน (Road Network) สมมติบนภาพ
        // ==========================================
        const nodes = {
            'A': { lat: 200, lng: 400, name: "บางนา" },
            'B': { lat: 200, lng: 1000, name: "ศรีนครินทร์ (แยกลำสาลี)" },
            'C': { lat: 800, lng: 1000, name: "ลาดพร้าว (บางกะปิ)" },
            'D': { lat: 800, lng: 400, name: "ดินแดง" },
            'E': { lat: 500, lng: 700, name: "พระราม 9" },
            'F': { lat: 200, lng: 1600, name: "สุวรรณภูมิ" },
            'G': { lat: 800, lng: 1600, name: "มีนบุรี" }
        };

        // สร้างจุดป้ายชื่อบนแผนที่
        for (let key in nodes) {
            L.marker([nodes[key].lat, nodes[key].lng], {
                icon: L.divIcon({ className: 'poi-icon', html: nodes[key].name, iconSize: null, iconAnchor:[0,0] })
            }).addTo(map);
        }

        // กำหนดเส้นทาง (Edges)
        const roads = [
            { id: 'R1', from: 'A', to: 'D', name: "ถ.วิภาวดี-ดินแดง", coords: [[nodes['A'].lat, nodes['A'].lng], [nodes['D'].lat, nodes['D'].lng]] },
            { id: 'R2', from: 'D', to: 'C', name: "ถ.ลาดพร้าว", coords: [[nodes['D'].lat, nodes['D'].lng], [nodes['C'].lat, nodes['C'].lng]] },
            { id: 'R3', from: 'C', to: 'B', name: "ถ.ศรีนครินทร์ (เหนือ)", coords: [[nodes['C'].lat, nodes['C'].lng], [nodes['B'].lat, nodes['B'].lng]] },
            { id: 'R4', from: 'B', to: 'A', name: "ถ.ศรีนครินทร์ (ใต้)", coords: [[nodes['B'].lat, nodes['B'].lng], [nodes['A'].lat, nodes['A'].lng]] },
            { id: 'R5', from: 'D', to: 'E', name: "ถ.พระราม 9 (ตะวันตก)", coords: [[nodes['D'].lat, nodes['D'].lng], [nodes['E'].lat, nodes['E'].lng]] },
            { id: 'R6', from: 'E', to: 'B', name: "ถ.พระราม 9 (ตะวันออก)", coords: [[nodes['E'].lat, nodes['E'].lng], [nodes['B'].lat, nodes['B'].lng]] },
            { id: 'R7', from: 'B', to: 'F', name: "มอเตอร์เวย์", coords: [[nodes['B'].lat, nodes['B'].lng], [nodes['F'].lat, nodes['F'].lng]] },
            { id: 'R8', from: 'C', to: 'G', name: "ถ.เสรีไทย", coords: [[nodes['C'].lat, nodes['C'].lng], [nodes['G'].lat, nodes['G'].lng]] },
            { id: 'R9', from: 'F', to: 'G', name: "ถ.ร่มเกล้า", coords: [[nodes['F'].lat, nodes['F'].lng], [nodes['G'].lat, nodes['G'].lng]] }
        ];

        // วาดเส้นถนนเริ่มต้น
        let roadLayers = {};
        roads.forEach(road => {
            let polyline = L.polyline(road.coords, { color: '#3b82f6', weight: 6, opacity: 0.8 }).addTo(map);
            polyline.bindTooltip(road.name);
            roadLayers[road.id] = polyline;
        });

        // 4. จุดสถานีสูบน้ำใกล้เคียง (โชว์ Effect ตอนน้ำท่วม)
        let pump1 = L.marker([850, 700], {
            icon: L.divIcon({ className: 'custom-icon-wrapper', html: `<div class="station-icon pump-normal">P</div>`, iconSize: [28, 28], iconAnchor: [14, 14] })
        }).addTo(map).bindTooltip('สถานีสูบน้ำลาดพร้าว', {permanent: true, direction: 'top', offset: [0, -10]});

        let pump2 = L.marker([250, 850], {
            icon: L.divIcon({ className: 'custom-icon-wrapper', html: `<div class="station-icon pump-normal">P</div>`, iconSize: [28, 28], iconAnchor: [14, 14] })
        }).addTo(map).bindTooltip('สถานีสูบน้ำคลองชวดใหญ่', {permanent: true, direction: 'top', offset: [0, -10]});

        // ==========================================
        // 5. ระบบ Routing Algorithm & Simulation
        // ==========================================
        
        function triggerFlood(scenario) {
            resetRoutes(false); // ล้างของเก่าก่อนโดยไม่ต้องซูมออก
            
            const statusBox = document.getElementById('route-status');
            const rerouteInfo = document.getElementById('reroute-info');
            const rerouteSteps = document.getElementById('reroute-steps');
            
            rerouteInfo.classList.remove('hidden');

            if (scenario === 'ladprao') {
                // น้ำท่วมเส้น R2 (ลาดพร้าว)
                roadLayers['R2'].setStyle({ color: '#ef4444', weight: 8, dashArray: '15, 10' }); 
                roadLayers['R2'].bringToFront();
                
                // เครื่องสูบน้ำลาดพร้าวทำงาน
                pump1.setIcon(L.divIcon({ className: 'custom-icon-wrapper', html: `<div class="station-icon pump-working">P</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }));
                
                // แนะนำเส้นทางเลี่ยง (เขียว) จาก D -> E -> B -> C แทน
                roadLayers['R5'].setStyle({ color: '#10b981', weight: 8, dashArray: '15, 10' }).bringToFront();
                roadLayers['R6'].setStyle({ color: '#10b981', weight: 8, dashArray: '15, 10' }).bringToFront();
                roadLayers['R3'].setStyle({ color: '#10b981', weight: 8, dashArray: '15, 10' }).bringToFront();

                // อัปเดต UI
                statusBox.className = "bg-red-500/20 border border-red-500 p-3 rounded-lg text-red-400 mb-3 transition-all duration-300";
                statusBox.innerHTML = `<div class="flex items-center gap-2 font-bold mb-1"><i class="fa-solid fa-triangle-exclamation"></i> น้ำท่วมขังรอการระบาย</div><p class="text-xs">ระดับน้ำ 15-20 ซม. บริเวณ ถ.ลาดพร้าว (ช่วงรัชดา-บางกะปิ) รถเล็กผ่านไม่ได้</p>`;
                
                rerouteSteps.innerHTML = `
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-blue-500 before:rounded-full"><b>จุดเริ่มต้น:</b> ดินแดง</li>
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-green-400 before:rounded-full"><span class="text-green-400">เลี่ยงเข้า:</span> ถ.พระราม 9 (ตะวันตก)</li>
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-green-400 before:rounded-full"><span class="text-green-400">เลี้ยวซ้ายเข้า:</span> ถ.ศรีนครินทร์ (เหนือ) ที่แยกลำสาลี</li>
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-blue-500 before:rounded-full"><b>จุดหมาย:</b> บางกะปิ</li>
                `;
                
                // แพนกล้องไปที่จุดเกิดเหตุ
                map.flyTo([650, 700], 0, { animate: true, duration: 1 }); 
            } 
            else if (scenario === 'srinagarindra') {
                // น้ำท่วมเส้น R4 (ศรีนครินทร์ใต้)
                roadLayers['R4'].setStyle({ color: '#ef4444', weight: 8, dashArray: '15, 10' });
                roadLayers['R4'].bringToFront();
                
                // เครื่องสูบน้ำชวดใหญ่ทำงาน
                pump2.setIcon(L.divIcon({ className: 'custom-icon-wrapper', html: `<div class="station-icon pump-working">P</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }));
                
                // แนะนำเส้นทางเลี่ยง A -> D -> E -> B
                roadLayers['R1'].setStyle({ color: '#10b981', weight: 8, dashArray: '15, 10' }).bringToFront();
                roadLayers['R5'].setStyle({ color: '#10b981', weight: 8, dashArray: '15, 10' }).bringToFront();
                roadLayers['R6'].setStyle({ color: '#10b981', weight: 8, dashArray: '15, 10' }).bringToFront();

                statusBox.className = "bg-orange-500/20 border border-orange-500 p-3 rounded-lg text-orange-400 mb-3 transition-all duration-300";
                statusBox.innerHTML = `<div class="flex items-center gap-2 font-bold mb-1"><i class="fa-solid fa-water"></i> เฝ้าระวังน้ำล้นตลิ่ง</div><p class="text-xs">ระดับน้ำปริ่มฟุตบาท ถ.ศรีนครินทร์ (ช่วงอ่อนนุช-บางนา) การจราจรติดขัดหนัก</p>`;
                
                rerouteSteps.innerHTML = `
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-blue-500 before:rounded-full"><b>จุดเริ่มต้น:</b> บางนา</li>
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-green-400 before:rounded-full"><span class="text-green-400">ใช้ทางด่วน/เลี่ยงเข้า:</span> ถ.วิภาวดี-ดินแดง</li>
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-green-400 before:rounded-full"><span class="text-green-400">เลี้ยวขวาเข้า:</span> ถ.พระราม 9 เพื่อมุ่งหน้าตะวันออก</li>
                    <li class="relative before:content-[''] before:absolute before:-left-[17px] before:top-1.5 before:w-2 before:h-2 before:bg-blue-500 before:rounded-full"><b>จุดหมาย:</b> แยกลำสาลี</li>
                `;
                
                map.flyTo([400, 700], 0, { animate: true, duration: 1 });
            }
        }

        function resetRoutes(zoomOut = true) {
            // คืนค่าเส้นถนนกลับเป็นสีน้ำเงินปกติ
            for (let key in roadLayers) {
                roadLayers[key].setStyle({ color: '#3b82f6', weight: 6, dashArray: '' });
                roadLayers[key].bringToBack();
            }
            
            // หยุดการทำงานของปั๊มน้ำ
            let normalIcon = L.divIcon({ className: 'custom-icon-wrapper', html: `<div class="station-icon pump-normal">P</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
            pump1.setIcon(normalIcon);
            pump2.setIcon(normalIcon);

            // รีเซ็ต UI กล่องข้อความ
            document.getElementById('reroute-info').classList.add('hidden');
            const statusBox = document.getElementById('route-status');
            statusBox.className = "bg-green-500/20 border border-green-500 p-3 rounded-lg text-green-400 mb-3 transition-all duration-300";
            statusBox.innerHTML = `<div class="flex items-center gap-2 font-bold mb-1"><i class="fa-solid fa-circle-check"></i> เส้นทางปกติ (ปลอดภัย)</div><p class="text-xs">ปัจจุบันไม่มีรายงานน้ำท่วมขังบนถนนสายหลัก สามารถสัญจรได้ตามปกติ</p>`;
            
            if(zoomOut) {
                map.flyTo([600, 1000], -1, { animate: true, duration: 1 });
            }
        }

    </script>
</body>
</html>
