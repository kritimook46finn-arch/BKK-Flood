<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKK Flood & Rain Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; }
        
        /* สไตล์สำหรับซ่อน/แสดง iframe อย่างนุ่มนวล */
        .tab-content { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .tab-content.active { display: block; opacity: 1; }
        
        /* ปุ่ม Tab */
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { 
            background-color: #3b82f6; /* bg-blue-500 */
            color: #ffffff;
            border-color: #60a5fa; /* border-blue-400 */
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .tab-btn.inactive {
            background-color: #1e293b; /* bg-slate-800 */
            color: #94a3b8; /* text-slate-400 */
            border-color: #334155; /* border-slate-700 */
        }
        .tab-btn.inactive:hover {
            background-color: #334155;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header & Tabs -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4 shrink-0 shadow-lg z-10">
        
        <!-- Logo -->
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-water text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide text-white">BKK <span class="text-blue-500">MONITOR</span></h1>
        </div>

        <!-- Tab Controls -->
        <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
            <button onclick="switchTab('klong')" id="btn-klong" class="tab-btn active flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border whitespace-nowrap">
                <i class="fa-solid fa-map"></i> แผนผังคลอง กทม.
            </button>
            <button onclick="switchTab('radar')" id="btn-radar" class="tab-btn inactive flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border whitespace-nowrap">
                <i class="fa-solid fa-cloud-showers-heavy"></i> เรดาร์ฝน กทม.
            </button>
        </div>

        <!-- Clock & Auto Refresh -->
        <div class="hidden md:flex items-center gap-4 text-right">
            <div class="text-xs text-slate-400">
                <span>ดึงข้อมูลตรงจาก: weather.bangkok.go.th</span>
            </div>
            <div id="clock" class="text-lg font-mono font-bold text-blue-400 bg-slate-800 px-3 py-1 rounded-md border border-slate-700">--:--:--</div>
        </div>
    </header>

    <!-- Content Area (Iframes) -->
    <main class="flex-1 relative bg-slate-800">
        
        <!-- Tab 1: แผนผังคลอง -->
        <!-- ลบ ?fbclid=... ออกเพื่อให้ URL สะอาดและทำงานได้เร็วขึ้น -->
        <iframe 
            id="tab-klong" 
            src="https://weather.bangkok.go.th/KlongMap" 
            class="tab-content active absolute inset-0 w-full h-full border-0">
        </iframe>

        <!-- Tab 2: เรดาร์ฝน -->
        <iframe 
            id="tab-radar" 
            src="https://weather.bangkok.go.th/rain/" 
            class="tab-content absolute inset-0 w-full h-full border-0">
        </iframe>

    </main>

    <script>
        // 1. ฟังก์ชันนาฬิกา
        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('th-TH');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. ฟังก์ชันสลับ Tab
        function switchTab(tabName) {
            // ดึง Element ของปุ่มและเนื้อหา
            const btnKlong = document.getElementById('btn-klong');
            const btnRadar = document.getElementById('btn-radar');
            const tabKlong = document.getElementById('tab-klong');
            const tabRadar = document.getElementById('tab-radar');

            if (tabName === 'klong') {
                // สลับคลาสปุ่ม
                btnKlong.className = "tab-btn active flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border whitespace-nowrap";
                btnRadar.className = "tab-btn inactive flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border whitespace-nowrap";
                
                // สลับการแสดงผล iframe
                tabKlong.classList.add('active');
                tabRadar.classList.remove('active');
            } 
            else if (tabName === 'radar') {
                // สลับคลาสปุ่ม
                btnRadar.className = "tab-btn active flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border whitespace-nowrap";
                btnKlong.className = "tab-btn inactive flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border whitespace-nowrap";
                
                // สลับการแสดงผล iframe
                tabRadar.classList.add('active');
                tabKlong.classList.remove('active');
            }
        }

        // 3. ฟังก์ชันรีเฟรช iframe อัตโนมัติทุกๆ 5 นาที (ป้องกันเว็บ กทม. ค้าง)
        setInterval(() => {
            const klongFrame = document.getElementById('tab-klong');
            const radarFrame = document.getElementById('tab-radar');
            
            // รีเฟรชเฉพาะหน้าที่กำลังเปิดอยู่เพื่อไม่ให้กระตุก
            if (klongFrame.classList.contains('active')) {
                klongFrame.src = klongFrame.src;
            } else {
                radarFrame.src = radarFrame.src;
            }
        }, 5 * 60 * 1000); // 5 นาที
    </script>
</body>
</html>
